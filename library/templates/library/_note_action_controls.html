<form method="post" action="{% url 'note_toggle_favorite' note.pk %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="note-favorite-button{% if note.is_favorite %} is-active{% endif %}{% if in_menu %} book-actions__button{% endif %}" type="submit" aria-label="{% if note.is_favorite %}Прибрати нотатку з улюблених{% else %}Додати нотатку в улюблені{% endif %}">{% if note.is_favorite %}<iconify-icon class="action-icon" icon="ic:baseline-favorite" aria-hidden="true"></iconify-icon> Улюблена{% else %}<iconify-icon class="action-icon" icon="ic:baseline-favorite-border" aria-hidden="true"></iconify-icon> В улюблені{% endif %}</button>
</form>
<a class="note-edit-link" href="{% url 'note_update' note.pk %}?next={{ request.get_full_path|urlencode }}"><iconify-icon class="action-icon" icon="ic:baseline-edit" aria-hidden="true"></iconify-icon> Редагувати</a>
<form method="post" action="{% url 'note_delete' note.pk %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="text-danger-button{% if in_menu %} book-actions__button{% endif %}" type="submit"><iconify-icon class="action-icon" icon="ic:baseline-delete" aria-hidden="true"></iconify-icon> Видалити</button>
</form>
