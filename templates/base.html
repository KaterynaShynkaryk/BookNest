<!doctype html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BookNest{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block app_nav %}
        <header class="app-header">
            <nav class="container-xxl app-navbar" aria-label="Головна навігація">
                <a class="brand-mark" href="{% url 'book_list' %}">
                    <span class="brand-icon" aria-hidden="true">⌁</span>
                    <span>Моя бібліотека</span>
                </a>
                <div class="nav-actions">
                    {% if user.is_authenticated %}
                        <span class="nav-greeting d-none d-sm-inline">{{ user.username }}</span>
                        <a class="nav-link-button" href="{% url 'logout' %}">Вийти</a>
                    {% else %}
                        <a class="nav-link-button" href="{% url 'login' %}">Увійти</a>
                        <a class="primary-link-button" href="{% url 'register' %}">Реєстрація</a>
                    {% endif %}
                </div>
            </nav>
        </header>
    {% endblock %}

    <main class="{% block main_class %}container-xxl content-wrap{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
