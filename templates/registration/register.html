{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
    <h2>Реєстрація</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create account</button>
    </form>
    <p>Вже маєш акаунт? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
