{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
    <h2>Увійти</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p>Немає акаунту? <a href="{% url 'register' %}">Реєстрація</a></p>
{% endblock %}
