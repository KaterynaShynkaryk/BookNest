databases:
  - name: booknest-db
    plan: basic-256mb
    databaseName: booknest
    user: booknest
    diskSizeGB: 1

services:
  - type: web
    name: booknest
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booknest-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_WHITENOISE
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"