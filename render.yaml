databases:
  - name: booknest-db
    plan: free
    databaseName: booknest
    user: booknest

services:
  - type: web
    name: booknest
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: booknest-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: USE_WHITENOISE
        value: "True"
      - key: WEB_CONCURRENCY
        value: "2"